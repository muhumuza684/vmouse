name: Build VMouse

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb python3-tk
          pip install pytest pyopenssl psutil websockets pyautogui pillow "qrcode[pil]" pystray python-xlib
      - name: Run tests
        run: |
          if [ -d tests ]; then xvfb-run -a python -m pytest -q tests; else echo "No tests folder yet"; fi

  windows:
    name: Windows (exe and installer)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build VMouse.exe
        run: python build_app.py
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\VMouse.iss
      - uses: actions/upload-artifact@v4
        with:
          name: VMouse-windows
          path: |
            dist/VMouse.exe
            dist/VMouse-Setup-*.exe

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-xlib scrot
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pyinstaller python-xlib
      - name: Build
        run: python build_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: VMouse-linux
          path: dist/VMouse-*-linux.tar.gz

  macos:
    name: Mac
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build
        run: python build_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: VMouse-mac
          path: dist/VMouse-*-mac.zip

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Add release signing key (only if you stored one)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "Release signing enabled"
          else
            echo "No signing key stored: the APK will be signed with the debug key"
          fi
      - name: Build release APK
        run: flutter build apk --release
      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk VMouse.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VMouse-android
          path: VMouse.apk

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ test, windows, linux, macos, android ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Give the files stable download names
        run: |
          mkdir release
          cp artifacts/VMouse-windows/VMouse-Setup-*.exe release/VMouse-Setup.exe
          cp artifacts/VMouse-windows/VMouse.exe release/VMouse-portable.exe
          cp artifacts/VMouse-linux/*.tar.gz release/VMouse-linux.tar.gz
          cp artifacts/VMouse-mac/*.zip release/VMouse-mac.zip
          cp artifacts/VMouse-android/VMouse.apk release/VMouse.apk
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
